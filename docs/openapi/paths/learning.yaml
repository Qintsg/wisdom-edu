getLearningPath:
  get:
    tags: [Learning]
    operationId: getLearningPath
    summary: 获取个性化学习路径
    parameters:
      - name: course_id
        in: query
        required: true
        schema:
          type: integer
    responses:
      "200":
        description: data 为 LearningPath；未完成测评时 need_assessment=true 并给出 next_step。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/ApiEnvelope.yaml
      "404":
        $ref: ../components/responses.yaml#/NotFound

adjustLearningPath:
  post:
    tags: [Learning]
    operationId: adjustLearningPath
    summary: 刷新或调整学习路径
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [course_id]
            properties:
              course_id:
                type: integer
              reason:
                type: string
                description: manual_refresh、rebuild、refresh 时重建；其它值插入补强节点。
    responses:
      "200":
        $ref: ../components/responses.yaml#/Success
      "404":
        $ref: ../components/responses.yaml#/NotFound

getLearningProgress:
  get:
    tags: [Learning]
    operationId: getLearningProgress
    summary: 获取学习路径进度
    parameters:
      - name: course_id
        in: query
        required: true
        schema:
          type: integer
    responses:
      "200":
        description: data 包含 total_nodes、completed_nodes、progress_rate、study_time、current_node。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/ApiEnvelope.yaml

getPathNodeDetail:
  get:
    tags: [Learning]
    operationId: getPathNodeDetail
    summary: 获取学习路径节点详情
    parameters:
      - $ref: ../components/parameters.yaml#/NodeIdPath
      - $ref: ../components/parameters.yaml#/CourseId
    responses:
      "200":
        description: data 包含节点信息、资源、进度和当前掌握度。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/ApiEnvelope.yaml
      "404":
        $ref: ../components/responses.yaml#/NotFound

startLearningNode:
  post:
    tags: [Learning]
    operationId: startLearningNode
    summary: 开始学习节点
    parameters:
      - $ref: ../components/parameters.yaml#/NodeIdPath
    responses:
      "200":
        description: data 包含 node_id、status。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/ApiEnvelope.yaml
      "409":
        $ref: ../components/responses.yaml#/Conflict

      "404":
        $ref: ../components/responses.yaml#/NotFound
completePathNode:
  post:
    tags: [Learning]
    operationId: completePathNode
    summary: 标记学习节点完成
    parameters:
      - $ref: ../components/parameters.yaml#/NodeIdPath
    responses:
      "200":
        description: data 包含 node_id、status、path_refreshed。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/ApiEnvelope.yaml
      "409":
        $ref: ../components/responses.yaml#/Conflict

      "404":
        $ref: ../components/responses.yaml#/NotFound
skipPathNode:
  post:
    tags: [Learning]
    operationId: skipPathNode
    summary: 跳过学习节点
    parameters:
      - $ref: ../components/parameters.yaml#/NodeIdPath
    responses:
      "200":
        $ref: ../components/responses.yaml#/Success

      "404":
        $ref: ../components/responses.yaml#/NotFound
listPathNodeResources:
  get:
    tags: [Learning]
    operationId: listPathNodeResources
    summary: 获取节点资源列表兼容接口
    description: 现阶段返回空 resources[]，推荐使用 ai-resources 接口。
    parameters:
      - $ref: ../components/parameters.yaml#/NodeIdPath
    responses:
      "200":
        $ref: ../components/responses.yaml#/Success

      "404":
        $ref: ../components/responses.yaml#/NotFound
getPathNodeAIResources:
  get:
    tags: [Learning, AI]
    operationId: getPathNodeAIResources
    summary: 获取节点 AI 推荐资源
    parameters:
      - $ref: ../components/parameters.yaml#/NodeIdPath
    responses:
      "200":
        description: data 包含 internal_resources、external_resources、service_status。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/ApiEnvelope.yaml

      "404":
        $ref: ../components/responses.yaml#/NotFound
completeNodeResource:
  post:
    tags: [Learning]
    operationId: completeNodeResource
    summary: 标记节点资源学习完成
    parameters:
      - $ref: ../components/parameters.yaml#/NodeIdPath
      - $ref: ../components/parameters.yaml#/ResourceIdPath
    responses:
      "200":
        description: data 包含 completed_resources 等进度字段。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/ApiEnvelope.yaml

      "404":
        $ref: ../components/responses.yaml#/NotFound
pauseNodeResource:
  post:
    tags: [Learning]
    operationId: pauseNodeResource
    summary: 暂停资源学习并保存位置
    parameters:
      - $ref: ../components/parameters.yaml#/NodeIdPath
      - $ref: ../components/parameters.yaml#/ResourceIdPath
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              position:
                description: 前端播放或阅读位置。
    responses:
      "200":
        $ref: ../components/responses.yaml#/Success

      "404":
        $ref: ../components/responses.yaml#/NotFound
listPathNodeExams:
  get:
    tags: [Learning, Exams]
    operationId: listPathNodeExams
    summary: 获取节点测验列表
    parameters:
      - $ref: ../components/parameters.yaml#/NodeIdPath
    responses:
      "200":
        description: data.exams[] 包含 exam_id、title、duration、pass_score。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/ApiEnvelope.yaml

      "404":
        $ref: ../components/responses.yaml#/NotFound
submitNodeExam:
  post:
    tags: [Learning, Exams]
    operationId: submitNodeExam
    summary: 提交节点练习或小测验
    parameters:
      - $ref: ../components/parameters.yaml#/NodeIdPath
      - $ref: ../components/parameters.yaml#/ExamIdPath
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [answers]
            properties:
              answers:
                type: object
                additionalProperties: true
    responses:
      "200":
        description: data 包含 score、total_score、passed、mistakes、mastery_update、node_status。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/ApiEnvelope.yaml

      "404":
        $ref: ../components/responses.yaml#/NotFound
getStageTest:
  get:
    tags: [Learning, Exams]
    operationId: getStageTest
    summary: 获取阶段测试题目
    parameters:
      - $ref: ../components/parameters.yaml#/NodeIdPath
    responses:
      "200":
        description: data 包含阶段测试题、已有结果或空状态。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/ApiEnvelope.yaml
      "400":
        $ref: ../components/responses.yaml#/BadRequest

      "404":
        $ref: ../components/responses.yaml#/NotFound
submitStageTest:
  post:
    tags: [Learning, Exams]
    operationId: submitStageTest
    summary: 提交阶段测试答案
    parameters:
      - $ref: ../components/parameters.yaml#/NodeIdPath
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [answers]
            properties:
              answers:
                type: object
                additionalProperties: true
    responses:
      "200":
        description: data 包含得分、通过状态、反馈报告、掌握度变化与节点状态。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/ApiEnvelope.yaml

      "404":
        $ref: ../components/responses.yaml#/NotFound
      "400":
        $ref: ../components/responses.yaml#/BadRequest
getStudentDashboard:
  get:
    tags: [Learning]
    operationId: getStudentDashboard
    summary: 获取学生仪表盘聚合数据
    parameters:
      - name: course_id
        in: query
        required: true
        schema:
          type: integer
    responses:
      "200":
        description: data 包含 progress、study_time、nodes_preview、recent_mastery、pending_exams。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/ApiEnvelope.yaml
      "400":
        $ref: ../components/responses.yaml#/BadRequest
