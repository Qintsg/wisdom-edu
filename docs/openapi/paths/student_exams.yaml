listStudentExams:
  get:
    tags: [Exams]
    operationId: listStudentExams
    summary: 获取学生可见作业列表
    parameters:
      - $ref: ../components/parameters.yaml#/CourseId
      - name: type
        in: query
        schema:
          type: string
      - $ref: ../components/parameters.yaml#/Page
      - name: size
        in: query
        schema:
          type: integer
          default: 20
          maximum: 100
    responses:
      "200":
        description: data 包含 total、exams[]。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/ApiEnvelope.yaml


getStudentExamDetail:
  get:
    tags: [Exams]
    operationId: getStudentExamDetail
    summary: 获取作业详情和题目
    parameters:
      - $ref: ../components/parameters.yaml#/ExamIdPath
    responses:
      "200":
        description: data 包含 exam_id、title、description、total_score、pass_score、duration、questions[]，不含标准答案。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/ApiEnvelope.yaml
      "403":
        $ref: ../components/responses.yaml#/Forbidden
      "404":
        $ref: ../components/responses.yaml#/NotFound


submitStudentExam:
  post:
    tags: [Exams]
    operationId: submitStudentExam
    summary: 提交作业答案
    parameters:
      - $ref: ../components/parameters.yaml#/ExamIdPath
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [answers]
            properties:
              answers:
                type: object
                additionalProperties: true
    responses:
      "200":
        description: data 包含 submission_id、score、pass_score、passed、question_details、mistakes、mastery_changes、feedback_report。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/ApiEnvelope.yaml
      "400":
        $ref: ../components/responses.yaml#/BadRequest


getStudentExamResult:
  get:
    tags: [Exams]
    operationId: getStudentExamResult
    summary: 获取作业结果
    parameters:
      - $ref: ../components/parameters.yaml#/ExamIdPath
    responses:
      "200":
        description: data 包含分数、通过状态、提交时间和 question_details。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/ApiEnvelope.yaml
      "404":
        $ref: ../components/responses.yaml#/NotFound


saveStudentExamDraft:
  post:
    tags: [Exams]
    operationId: saveStudentExamDraft
    summary: 保存作业草稿
    parameters:
      - $ref: ../components/parameters.yaml#/ExamIdPath
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              answers:
                type: object
                additionalProperties: true
    responses:
      "200":
        description: data 包含 submission_id、saved。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/ApiEnvelope.yaml


getStudentExamStatistics:
  get:
    tags: [Exams]
    operationId: getStudentExamStatistics
    summary: 获取学生视角作业统计
    parameters:
      - $ref: ../components/parameters.yaml#/ExamIdPath
    responses:
      "200":
        description: data 包含 my_score、average_score、total_submissions、my_rank。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/ApiEnvelope.yaml


getStudentExamAnswerSheet:
  get:
    tags: [Exams]
    operationId: getStudentExamAnswerSheet
    summary: 查看作业标准答案
    description: 只有已提交该作业后可查看。
    parameters:
      - $ref: ../components/parameters.yaml#/ExamIdPath
    responses:
      "200":
        description: data 为题目答案列表。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/ApiEnvelope.yaml
      "400":
        $ref: ../components/responses.yaml#/BadRequest


retakeStudentExam:
  post:
    tags: [Exams]
    operationId: retakeStudentExam
    summary: 重置作业提交以重新作答
    parameters:
      - $ref: ../components/parameters.yaml#/ExamIdPath
    responses:
      "200":
        $ref: ../components/responses.yaml#/Success


downloadStudentExamResult:
  get:
    tags: [Exams]
    operationId: downloadStudentExamResult
    summary: 下载作业答案报告 CSV
    parameters:
      - $ref: ../components/parameters.yaml#/ExamIdPath
    responses:
      "200":
        $ref: ../components/responses.yaml#/CsvDownload


listStudentClassMembers:
  get:
    tags: [Courses, Exams]
    operationId: listStudentClassMembers
    summary: 获取班级成员列表
    parameters:
      - $ref: ../components/parameters.yaml#/ClassIdPath
    responses:
      "200":
        $ref: ../components/responses.yaml#/Success
      "403":
        $ref: ../components/responses.yaml#/Forbidden


getStudentClassRanking:
  get:
    tags: [Courses, Exams]
    operationId: getStudentClassRanking
    summary: 获取班级学习排行榜
    parameters:
      - $ref: ../components/parameters.yaml#/ClassIdPath
    responses:
      "200":
        $ref: ../components/responses.yaml#/Success


listStudentClassNotifications:
  get:
    tags: [Courses, Exams]
    operationId: listStudentClassNotifications
    summary: 获取班级通知公告简表
    parameters:
      - $ref: ../components/parameters.yaml#/ClassIdPath
    responses:
      "200":
        $ref: ../components/responses.yaml#/Success


listStudentClassAssignments:
  get:
    tags: [Courses, Exams]
    operationId: listStudentClassAssignments
    summary: 获取班级作业列表
    parameters:
      - $ref: ../components/parameters.yaml#/ClassIdPath
    responses:
      "200":
        $ref: ../components/responses.yaml#/Success


generateStudentFeedbackReport:
  post:
    tags: [Exams, AI]
    operationId: generateStudentFeedbackReport
    summary: 生成或重新排队 AI 反馈报告
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [exam_id]
            properties:
              exam_id:
                type: integer
              force:
                type: boolean
                default: false
    responses:
      "200":
        description: data 为反馈报告结构。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/ApiEnvelope.yaml
      "404":
        $ref: ../components/responses.yaml#/NotFound


getStudentFeedbackReport:
  get:
    tags: [Exams, AI]
    operationId: getStudentFeedbackReport
    summary: 获取作业反馈报告
    parameters:
      - $ref: ../components/parameters.yaml#/ExamIdPath
    responses:
      "200":
        $ref: ../components/responses.yaml#/Success
      "404":
        $ref: ../components/responses.yaml#/NotFound


startLegacyInitialAssessment:
  post:
    tags: [Assessments, Exams]
    operationId: startLegacyInitialAssessment
    summary: 开始旧版课程初始评测随机抽题
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [course_id]
            properties:
              course_id:
                type: integer
    responses:
      "200":
        description: data 包含 course_id、questions[]、count。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/ApiEnvelope.yaml


submitLegacyInitialAssessment:
  post:
    tags: [Assessments, Exams]
    operationId: submitLegacyInitialAssessment
    summary: 提交旧版课程初始评测
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [course_id, answers]
            properties:
              course_id:
                type: integer
              answers:
                type: object
                additionalProperties: true
    responses:
      "200":
        description: data 包含 score、correct_count、total_count、knowledge_mastery。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/ApiEnvelope.yaml
