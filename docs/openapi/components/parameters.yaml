Page:
  name: page
  in: query
  required: false
  schema:
    type: integer
    minimum: 1
    default: 1
  description: 页码。

PageSize:
  name: page_size
  in: query
  required: false
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 20
  description: 每页数量。部分旧接口使用 `size`，对应接口会单独声明。

CourseId:
  name: course_id
  in: query
  required: false
  schema:
    type: integer
  description: 课程 ID。

ClassIdPath:
  name: class_id
  in: path
  required: true
  schema:
    type: integer
  description: 班级 ID。

UserIdPath:
  name: user_id
  in: path
  required: true
  schema:
    type: integer
  description: 用户 ID。

PointIdPath:
  name: point_id
  in: path
  required: true
  schema:
    type: integer
  description: 知识点 ID。

ResourceIdPath:
  name: resource_id
  in: path
  required: true
  schema:
    type: string
  description: 资源 ID。学习路径资源接口允许外部资源 ID 字符串。

QuestionIdPath:
  name: question_id
  in: path
  required: true
  schema:
    type: integer
  description: 题目 ID。

NodeIdPath:
  name: node_id
  in: path
  required: true
  schema:
    type: integer
  description: 学习路径节点 ID。

ExamIdPath:
  name: exam_id
  in: path
  required: true
  schema:
    type: integer
  description: 作业/考试 ID。
