        type: integer
      description: 课程 ID。
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
      description: 页码。
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: 每页数量。部分旧接口使用 `size`，对应接口会单独声明。
    UserIdPath:
      name: user_id
      in: path
      required: true
      schema:
        type: integer
      description: 用户 ID。
    ClassIdPath:
      name: class_id
      in: path
      required: true
      schema:
        type: integer
      description: 班级 ID。
    PointIdPath:
      name: point_id
      in: path
      required: true
      schema:
        type: integer
      description: 知识点 ID。
    ResourceIdPath:
      name: resource_id
      in: path
      required: true
      schema:
        type: string
      description: 资源 ID。学习路径资源接口允许外部资源 ID 字符串。
    QuestionIdPath:
      name: question_id
      in: path
      required: true
      schema:
        type: integer
      description: 题目 ID。
    NodeIdPath:
      name: node_id
      in: path
      required: true
      schema:
        type: integer
      description: 学习路径节点 ID。
    ExamIdPath:
      name: exam_id
      in: path
      required: true
      schema:
        type: integer
      description: 作业/考试 ID。
  responses:
    Success:
      description: 成功响应。实际 `data` 结构以接口说明为准。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiEnvelope'
    BadRequest:
      description: 请求参数错误或业务校验失败。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: 未认证或 Token 无效。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    JsonDownload:
      description: JSON 文件下载。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FileDownload'
    Forbidden:
      description: 已认证但无权限访问。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CsvDownload:
      description: CSV 文件下载。
      content:
        text/csv:
          schema:
            $ref: '#/components/schemas/FileDownload'
    NotFound:
      description: 资源不存在。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Created:
      description: 创建成功。
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiEnvelope'
              - type: object
                properties:
                  code:
                    example: 201
    ServerError:
      description: 服务端处理失败。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: 资源状态冲突。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
