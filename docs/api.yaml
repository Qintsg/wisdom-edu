components:
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: '使用登录或刷新接口返回的 `token`，请求头格式为 `Authorization: Bearer <token>`。'
  schemas:
    ApiEnvelope:
      type: object
      required:
        - code
        - msg
        - data
      properties:
        code:
          type: integer
          description: 业务状态码，成功通常为 200，创建成功为 201。
          example: 200
        msg:
          type: string
          description: 用户可读消息。
          example: 操作成功
        data:
          description: 业务数据。不同接口返回结构不同，详见各接口说明。
    ErrorResponse:
      type: object
      required:
        - code
        - msg
        - data
      properties:
        code:
          type: integer
          example: 400
        msg:
          type: string
          example: 缺少必要参数
        data:
          description: 错误响应通常为 null，部分接口可能附带调试或校验上下文。
        error:
          type: object
          nullable: true
          properties:
            type:
              type: string
              example: validation_error
            details:
              description: DRF 校验错误或后端补充的错误详情。
    FileDownload:
      type: string
      format: binary
      description: 文件下载响应，实际 Content-Type 由接口决定。
    IdListRequest:
      type: object
      required:
        - ids
      properties:
        ids:
          type: array
          items:
            type: integer
          minItems: 1
    Pagination:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
        size:
          type: integer
    User:
      type: object
      properties:
        user_id:
          type: integer
        username:
