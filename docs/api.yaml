openapi: 3.0.3
info:
  title: WisdomEdu API
  version: 2026.05.12
  description: 知识图谱驱动的个性化自适应学习系统后端接口契约。本文档依据后端路由、视图、support 与 serializer 逐项人工整理。
servers:
  - url: http://127.0.0.1:8000
    description: 本地 Django 开发服务
  - url: /
    description: 同源生产或反向代理入口
security:
  - jwtAuth: []
tags:
  - name: Health
    description: 服务可用性检查。
  - name: Auth
    description: 注册、登录、JWT、用户信息和密码管理。
  - name: Profile
    description: 学生学习者画像、习惯偏好和教师/管理员画像查看。
  - name: Courses
    description: 课程、班级、邀请码、公告和课程统计。
  - name: Knowledge
    description: 知识图谱、知识点、关系、资源和题库。
  - name: Assessments
    description: 初始知识测评、能力评测、习惯问卷和画像生成。
  - name: Learning
    description: 个性化学习路径、节点进度、阶段测试和仪表盘。
  - name: Exams
    description: 作业考试、提交、反馈报告、成绩和分析。
  - name: AI
    description: LLM、GraphRAG、学习建议、路径规划和 KT 兼容接口。
  - name: Admin
    description: 管理端用户、课程、班级、激活码和统计接口。
  - name: Logs
    description: 管理端操作日志查询、统计、导出和清理。
  - name: Common
    description: 前端公共元数据接口。
paths:
  /health/:
    get:
      tags:
        - Health
      operationId: healthCheck
      summary: 健康检查
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /api/auth/register:
    post:
      tags:
        - Auth
      operationId: register
      summary: 注册学生、教师或管理员账号
      description: 学生可直接注册；教师和管理员需要提交有效激活码。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                password:
                  type: string
                  format: password
                email:
                  type: string
                role:
                  type: string
                  enum:
                    - student
                    - teacher
                    - admin
                  default: student
                real_name:
                  type: string
                student_id:
                  type: string
                activation_code:
                  type: string
                  description: 教师和管理员注册必填。
      responses:
        '200':
          description: 注册成功，data 包含 user_id、username、role、token、refresh。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/auth/login:
    post:
      tags:
        - Auth
      operationId: login
      summary: 登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password
              properties:
                username:
                  type: string
                  description: 登录账号；也兼容 `account` 字段。
                account:
                  type: string
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: 登录成功，data 包含 user_id、username、role、token、refresh。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/auth/logout:
    post:
      tags:
        - Auth
      operationId: logout
      summary: 登出并尝试加入 refresh token 黑名单
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/userinfo:
    get:
      tags:
        - Auth
      operationId: getUserInfo
      summary: 获取当前用户信息
      responses:
        '200':
          description: data 包含用户基础信息、班级列表与课程列表。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/userinfo/update:
    put:
      tags:
        - Auth
      operationId: updateUserInfo
      summary: 更新当前用户信息和头像
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                username:
                  type: string
                email:
                  type: string
                phone:
                  type: string
                real_name:
                  type: string
                student_id:
                  type: string
                avatar:
                  type: string
                  format: binary
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                email:
                  type: string
                phone:
                  type: string
                real_name:
                  type: string
                student_id:
                  type: string
      responses:
        '200':
          description: data 包含 updated_fields 与 avatar。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/auth/token/refresh:
    post:
      tags:
        - Auth
      operationId: refreshToken
      summary: 刷新 JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refresh
              properties:
                refresh:
                  type: string
      responses:
        '200':
          description: data 包含新的 token 与 refresh。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/auth/password/change:
    post:
      tags:
        - Auth
      operationId: changePassword
      summary: 修改当前用户密码
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - old_password
                - new_password
              properties:
                old_password:
                  type: string
                  format: password
                new_password:
                  type: string
                  format: password
                  minLength: 8
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/auth/password/reset/send:
    post:
      tags:
        - Auth
      operationId: sendPasswordResetCode
      summary: 发送密码重置验证码
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/auth/password/reset:
    post:
      tags:
        - Auth
      operationId: resetPassword
      summary: 使用验证码重置密码
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - code
                - new_password
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
                new_password:
                  type: string
                  format: password
                  minLength: 6
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/student/profile:
    get:
      tags:
        - Profile
      operationId: getStudentProfile
      summary: 获取当前学生画像
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: data 包含 knowledge_mastery、ability_scores、habit_preferences、learner_tags、profile_summary、weakness、suggestion、strength、last_update。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
  /api/student/profile/habit:
    put:
      tags:
        - Profile
      operationId: updateHabitPreference
      summary: 更新学习习惯偏好
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                preferred_resource:
                  type: string
                preferred_study_time:
                  type: string
                study_pace:
                  type: string
                study_duration:
                  type: string
                review_frequency:
                  type: string
                learning_style:
                  type: string
                accept_challenge:
                  type: boolean
                daily_goal_minutes:
                  type: integer
                weekly_goal_days:
                  type: integer
                preferences:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/student/profile/update:
    post:
      tags:
        - Profile
      operationId: refreshStudentProfile
      summary: 重新生成当前学生课程画像
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - course_id
              properties:
                course_id:
                  type: integer
      responses:
        '200':
          description: data 包含 course_id、summary、weakness、suggestion、strength、kt_enhanced。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/student/profile/history:
    get:
      tags:
        - Profile
      operationId: getStudentProfileHistory
      summary: 获取学生画像历史
      parameters:
        - name: course_id
          in: query
          required: true
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: data 包含 course_id 与 history[]。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/student/profile/compare:
    get:
      tags:
        - Profile
      operationId: compareStudentProfile
      summary: 按日期对比学生画像快照
      parameters:
        - name: date1
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: date2
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/student/profile/export:
    post:
      tags:
        - Profile
      operationId: exportStudentProfile
      summary: 导出学生画像 JSON 文件
      responses:
        '200':
          $ref: '#/components/responses/JsonDownload'
  /api/admin/activation-codes:
    get:
      tags:
        - Admin
      operationId: listActivationCodes
      summary: 管理员分页查询激活码
      parameters:
        - name: code_type
          in: query
          schema:
            type: string
            enum:
              - teacher
              - admin
        - name: is_used
          in: query
          schema:
            type: boolean
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: data 包含 total、page、page_size、codes[]。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/activation-codes/generate:
    post:
      tags:
        - Admin
      operationId: generateActivationCodes
      summary: 批量生成激活码
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code_type:
                  type: string
                  enum:
                    - teacher
                    - admin
                  default: teacher
                count:
                  type: integer
                  minimum: 1
                  maximum: 50
                expires_days:
                  type: integer
                remark:
                  type: string
      responses:
        '201':
          description: data.codes[] 包含 id、code、code_type、expires_at。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/admin/activation-codes/batch-delete:
    post:
      tags:
        - Admin
      operationId: batchDeleteActivationCodes
      summary: 批量删除未使用激活码
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code_ids
              properties:
                code_ids:
                  type: array
                  items:
                    type: integer
      responses:
        '200':
          description: data.deleted_count 为删除数量。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/admin/activation-codes/validate:
    post:
      tags:
        - Admin
      operationId: validateActivationCode
      summary: 校验激活码可用性
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
      responses:
        '200':
          description: data 包含 code、code_type、is_valid、is_used、expires_at。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
  /api/admin/activation-codes/export:
    get:
      tags:
        - Admin
      operationId: exportActivationCodes
      summary: 导出激活码 CSV
      parameters:
        - name: code_type
          in: query
          schema:
            type: string
            enum:
              - teacher
              - admin
      responses:
        '200':
          $ref: '#/components/responses/CsvDownload'
  /api/admin/activation-codes/{code_id}:
    get:
      tags:
        - Admin
      operationId: getActivationCode
      summary: 获取单个激活码详情
      parameters:
        - name: code_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Admin
      operationId: deleteActivationCode
      summary: 删除未使用激活码
      parameters:
        - name: code_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/admin/users:
    get:
      tags:
        - Admin
      operationId: listAdminUsers
      summary: 管理员分页查询用户
      parameters:
        - $ref: '#/components/parameters/Page'
        - name: size
          in: query
          schema:
            type: integer
            default: 20
        - name: role
          in: query
          schema:
            type: string
            enum:
              - student
              - teacher
              - admin
        - name: query
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum:
              - active
              - inactive
      responses:
        '200':
          description: data 包含 total、page、size、users[]。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
  /api/admin/users/create:
    post:
      tags:
        - Admin
      operationId: createAdminUser
      summary: 管理员创建用户
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
                - role
              properties:
                username:
                  type: string
                password:
                  type: string
                  format: password
                role:
                  type: string
                  enum:
                    - student
                    - teacher
                    - admin
                email:
                  type: string
                phone:
                  type: string
                real_name:
                  type: string
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/admin/users/batch-delete:
    post:
      tags:
        - Admin
      operationId: batchDeleteAdminUsers
      summary: 批量删除用户
      description: 当前管理员账号会被排除，不允许删除自己。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user_ids
              properties:
                user_ids:
                  type: array
                  items:
                    type: integer
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/admin/users/import:
    post:
      tags:
        - Admin
      operationId: importAdminUsers
      summary: 导入用户 CSV 或 Excel
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: 支持 .csv、.xlsx、.xls。
      responses:
        '200':
          description: data 包含 created_count 与 skipped[]。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
  /api/admin/users/export:
    get:
      tags:
        - Admin
      operationId: exportAdminUsers
      summary: 导出用户 CSV
      parameters:
        - name: role
          in: query
          schema:
            type: string
            enum:
              - student
              - teacher
              - admin
      responses:
        '200':
          $ref: '#/components/responses/CsvDownload'
  /api/admin/users/template:
    get:
      tags:
        - Admin
      operationId: downloadAdminUserImportTemplate
      summary: 下载用户导入模板 CSV
      responses:
        '200':
          $ref: '#/components/responses/CsvDownload'
  /api/admin/users/{user_id}:
    get:
      tags:
        - Admin
      operationId: getAdminUserDetail
      summary: 获取用户详情
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/admin/users/{user_id}/update:
    put:
      tags:
        - Admin
      operationId: updateAdminUser
      summary: 管理员更新用户资料
      description: 不允许管理员修改自己的角色。
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                phone:
                  type: string
                real_name:
                  type: string
                role:
                  type: string
                  enum:
                    - student
                    - teacher
                    - admin
      responses:
        '200':
          description: data 包含 user_id 与 updated_fields。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/admin/users/{user_id}/delete:
    delete:
      tags:
        - Admin
      operationId: deleteAdminUser
      summary: 删除用户
      description: 不允许删除当前管理员自己。
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/admin/users/{user_id}/reset-password:
    post:
      tags:
        - Admin
      operationId: resetAdminUserPassword
      summary: 重置用户密码
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                new_password:
                  type: string
                  description: 省略时后端生成随机密码并返回。
      responses:
        '200':
          description: data 可能包含生成的 new_password。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
  /api/admin/users/{user_id}/disable:
    post:
      tags:
        - Admin
      operationId: disableAdminUser
      summary: 禁用用户
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /api/admin/users/{user_id}/enable:
    post:
      tags:
        - Admin
      operationId: enableAdminUser
      summary: 启用用户
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /api/admin/student-profiles:
    get:
      tags:
        - Admin
        - Profile
      operationId: listAdminStudentProfiles
      summary: 管理员分页查看学生画像摘要
      parameters:
        - $ref: '#/components/parameters/CourseId'
        - name: user_id
          in: query
          schema:
            type: integer
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: data 包含 total、page、page_size、profiles[]。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
  /api/admin/student-profiles/{student_id}:
    get:
      tags:
        - Admin
        - Profile
      operationId: getAdminStudentProfileDetail
      summary: 管理员查看学生画像详情
      parameters:
        - name: student_id
          in: path
          required: true
          schema:
            type: integer
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: data 包含画像、习惯、能力、答题统计等。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
  /api/teacher/students/{user_id}/profile:
    get:
      tags:
        - Profile
      operationId: getTeacherStudentProfile
      summary: 教师查看学生画像详情
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: data 包含 user_id、course_id、knowledge_mastery、answer_stats、profile_history 等。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/teacher/students/{user_id}/refresh-profile:
    post:
      tags:
        - Profile
      operationId: refreshTeacherStudentProfile
      summary: 教师刷新指定学生课程画像
      parameters:
